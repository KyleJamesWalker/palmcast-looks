name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: validate packs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate every pack
        run: make check

      - name: Assemble every pack
        run: make build
